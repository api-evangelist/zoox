aid: zoox
name: Zoox
description: >-
  Zoox is an Amazon subsidiary developing a purpose-built, bidirectional,
  symmetrical robotaxi vehicle designed from the ground up for autonomous
  ride-hailing rather than retrofitted from a conventional car. The vehicle
  carries up to four riders in a carriage-style seating layout, has no steering
  wheel or pedals, and is engineered for dense urban operation. Zoox provides
  the autonomous driving stack, the vehicle hardware, and a consumer ride-hail
  app. Commercial robotaxi service has launched in Las Vegas and San Francisco,
  with expansion announced for Austin, Miami, Atlanta, and Los Angeles. Acquired
  by Amazon in 2020, Zoox does not publish a public developer API or open
  research dataset; its public surface is product, ride-experience, and safety
  content. This profile captures the company surface for API Evangelist
  reference.
